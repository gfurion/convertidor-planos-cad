[project]
name = "convertidor-planos-cad"
version = "2.1.0"
description = "Convierte archivos DXF/DWG a versiones específicas de AutoCAD"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"app/gui.py" = ["F405"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
